name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.os }}, ${{ matrix.env }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        env: [py310, py312]
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          environments: ${{ matrix.env }}
          cache: true
      - run: pixi run -e ${{ matrix.env }} pytest -q

  pipeline:
    name: feature pipeline (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          environments: pipeline
          cache: true
      - name: Tests with bedtools, pyBigWig and hic-straw
        run: pixi run -e pipeline pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          cache: true
      - run: pixi run lint

  notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          cache: true
      - name: Execute every notebook
        run: pixi run notebooks
      - name: Executed notebooks
        uses: actions/upload-artifact@v7
        with:
          name: executed-notebooks
          path: notebooks/*.ipynb

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          environments: build
          cache: true
      - run: pixi run -e build build
      - name: Install the wheel in a clean venv and score the example
        run: |
          python -m venv /tmp/v && /tmp/v/bin/pip install dist/*.whl
          /tmp/v/bin/cislink info
          /tmp/v/bin/cislink score examples/example_features.tsv --keep ID | head -3
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
