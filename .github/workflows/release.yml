name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          environments: "default build"
      - name: Tests
        run: pixi run test
      - name: Check the tag matches the package version
        run: |
          v=$(pixi run python -c "import cislink; print(cislink.__version__)" | tail -1)
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != package v$v"; exit 1; }
      - run: pixi run -e build build
      - name: GitHub release with wheel, sdist and model files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* src/cislink/models/*.json --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* src/cislink/models/*.json --title "CisLink ${GITHUB_REF_NAME}" --generate-notes
          fi
