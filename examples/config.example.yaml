# cislink build configuration (GRCh38). Paths are examples; see docs/pipeline.md.
gtf: gencode.v29.annotation.gtf
transcript_quantification: RNAseq_transcript_quantifications.tsv   # ENCODE RSEM: transcript_id, TPM
gene_quantification: RNAseq_gene_quantifications.tsv               # ENCODE RSEM: gene_id, TPM
tracks:                       # bedGraph or bigWig; any subset (missing marks are left empty)
  DNase: ATAC_pval.bedGraph   # accessibility: ATAC-seq or DNase-seq
  H4K20me1: H4K20me1.bigWig
  H3K9me3: H3K9me3.bigWig
  H3K9ac: H3K9ac.bigWig
  H3K79me2: H3K79me2.bigWig
  H3K4me3: H3K4me3.bigWig
  H3K4me2: H3K4me2.bigWig
  H3K4me1: H3K4me1.bigWig
  H3K36me3: H3K36me3.bigWig
  H3K27me3: H3K27me3.bigWig
  H3K27ac: H3K27ac.bigWig
  H2A.Z: H2A.Z.bigWig
  CTCF: CTCF.bigWig
candidates: candidates.bed    # chrom, start, end, activity; or set accessibility_pvalue: ATAC_pval.bedGraph instead
hic: cell.hic                 # the cell's Hi-C for CisLink-E2G; omit for CisLink-V2G only
hic_resolution: 5000
hic_norm: KR
map_hic: true
# megamap: https://s3.us-central-1.wasabisys.com/aiden-encode-hic-mirror/bifocals_iter2/tissues.hic   (default)
# chromatin_quantiles: OUT.chromatin_quantiles.tsv   # reuse the cell's quantiles saved by a first run
# hic_quantiles: OUT.hic_quantiles.tsv
bedtools: bedtools
threads: 8
